<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d"><title>Lumen Price Radar</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top"><button id="menuBtn" class="icon">☰</button><div class="brand"><b>LUMEN</b><span>PRICE RADAR</span></div><div class="search"><span>⌕</span><input id="search" placeholder="ابحث عن لعبة..." autocomplete="off"><div id="suggestions"></div></div><button id="accountBtn" class="icon">◉</button></header>
<main>
<section class="hero"><div><small>LUMEN RADAR</small><h1>أقوى العروض في مكان واحد</h1><p>قارن أسعار الألعاب واكتشف أفضل صفقة.</p></div><div class="radar">◈</div></section>
<nav class="chips"><button class="chip active" data-sort="DealRating">الأكثر شعبية</button><button class="chip" data-sort="Savings">أعلى خصم</button><button class="chip" data-sort="Price">الأرخص</button></nav>
<section><div class="sectionHead"><h2>Most Popular Games</h2><button id="refresh">تحديث ↻</button></div><div id="popular" class="popular"></div></section>
<section><div class="sectionHead"><h2>New deals</h2><span id="status" class="muted">جاري التحميل...</span></div><div id="deals" class="dealList"></div></section>
<section><div class="sectionHead"><h2>Software & Apps</h2><span class="muted">روابط رسمية</span></div><div id="software" class="software"></div></section>
</main>
<div id="drawer" class="drawer hidden"><div class="drawerBox"><button id="closeDrawer" class="close">×</button><h2>Lumen</h2><button id="favBtn">♡ المفضلة</button><button id="platformBtn">▣ المنصات</button><button id="alertsBtn">♧ تنبيهات الأسعار</button><button id="accountDrawer">◉ الحساب</button></div></div>
<div id="modal" class="modal hidden"><div class="modalBox"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div>
<footer>Lumen Price Radar · الأسعار المعروضة بالجنيه المصري تقديرية حسب سعر الصرف.</footer>
<script src="/app.js"></script>
</body></html>
